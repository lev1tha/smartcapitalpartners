# Deployment: the frontend is deployed by the Vercel Git integration (vercel[bot]
# production deployments on master), so there is no deploy job here. The PHP API
# has no documented host yet.
name: CI

on:
  push:
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  frontend:
    name: Frontend (Vite + SSG)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24 # PROJECT.md: Node v24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund

      # TODO: 11 existing ESLint errors — remove continue-on-error after fixing.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      # gen-sitemap + tsc -b (typecheck) + vite-react-ssg build
      - name: Build
        run: npm run build

  backend:
    name: Backend (PHP API + e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5' # PROJECT.md: PHP 8.5
          extensions: curl, json, openssl
          coverage: none

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: PHP syntax check
        run: |
          set -e
          git ls-files '*.php' | xargs -n1 php -l

      # config.php is gitignored; tests/crm.e2e.mjs logs in as these fixture users.
      - name: Write CI config.php (fixture users, no real credentials)
        run: |
          cat > config.php <<'PHP'
          <?php
          $u = fn (string $login, string $role): array => [
              'login' => $login, 'password' => $login . '123', 'role' => $role, 'name' => 'CI ' . $login,
          ];
          return [
              'recipient' => 'ci@example.invalid',
              'smtp' => ['enabled' => false],
              'telegram' => ['enabled' => false],
              'admin' => ['password' => 'ci-admin'],
              'auth_secret' => 'ci-dummy-auth-secret',
              'users' => [
                  $u('director', 'director'), $u('manager', 'manager'), $u('marketer', 'marketer'),
                  $u('smm', 'smm'), $u('accountant', 'accountant'), $u('finance', 'finance'),
              ],
          ];
          PHP

      - name: Start PHP dev server
        run: |
          php -d 'sendmail_path=cat >/dev/null' -S 127.0.0.1:8000 -t public > "$RUNNER_TEMP/php-server.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/api/health > /dev/null && exit 0
            sleep 1
          done
          echo "PHP server did not start"; cat "$RUNNER_TEMP/php-server.log"; exit 1

      - name: E2E tests
        run: node tests/crm.e2e.mjs
        env:
          BASE: http://127.0.0.1:8000

      - name: PHP server log
        if: failure()
        run: cat "$RUNNER_TEMP/php-server.log"
