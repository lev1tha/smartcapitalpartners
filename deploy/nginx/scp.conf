# Smart Capital Partners — kpioshsu.com
# Фронт: статическая SSG-сборка (frontend/dist), API: gunicorn на 127.0.0.1:8000.
# HTTPS-блоки и редирект 80→443 добавит certbot (--nginx --redirect).

server {
    listen 80;
    listen [::]:80;
    server_name www.kpioshsu.com;
    return 301 $scheme://kpioshsu.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name kpioshsu.com;

    root /srv/scp/frontend/dist;
    index index.html;

    client_max_body_size 16m;   # UPLOAD_MAX_BYTES = 15 МБ

    # API и Django-admin → gunicorn
    location ~ ^/(api|django-admin)(/|$) {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Статика Django-admin (collectstatic)
    location /static/ {
        alias /srv/scp/backend/staticfiles/;
        expires 30d;
    }

    # Вложения задач и квитки
    location /uploads/ {
        alias /srv/scp/backend/uploads/;
        add_header X-Content-Type-Options nosniff;
    }

    # Хэшированные ассеты Vite — кэшируем надолго
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SSG: /catalog → catalog.html; неизвестные пути → index.html (SPA)
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}
